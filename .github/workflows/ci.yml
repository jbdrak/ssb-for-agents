name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --include=dev ensures devDependencies are installed even when
        # npm's global config has omit=dev set (can happen in some CI
        # environments or when the user's npm config leaks in).
        run: npm ci --include=dev

      - name: Check version consistency
        run: npm run check:version

      - name: Check README claim drift
        # Fails the build if README's "N tools" / tool-name / OpenAPI claims
        # drift from the actual codebase, and if README carries an exact
        # test-count claim that doesn't match the suite. README deliberately
        # avoids exact test counts (non-volatile wording), so suite growth
        # doesn't churn docs. Catches the silent-rot class of bugs (phantom
        # tools, stale counts) before they ship.
        run: npm run check:claims:quick

      - name: Check for credential leaks
        # Fails if auth.json, token-cache.json, or .ssb-for-agents/ are ever
        # committed. Belt-and-suspenders alongside .gitignore.
        run: npm run check:secrets

      - name: Run lint
        run: npm run lint

      - name: Check JSDoc types
        run: npm run check:types

      - name: Check strict types on critical runtime modules
        # A narrow strict config (tsconfig.strict-critical.json) gates the
        # critical runtime config module. Full strict mode is a broad unsafe
        # migration (2000+ errors across the codebase); this keeps a REAL
        # strict check green on the highest-leverage module without pretending
        # the non-strict baseline is strict.
        run: npx tsc -p tsconfig.strict-critical.json

      - name: Check for circular dependencies
        # Substitutes for the blocked `eslint-plugin-import/no-cycle` rule
        # (waiting on upstream support for ESLint 10). madge runs as a
        # standalone tool and exits non-zero on any cycle.
        run: npm run check:circular

      - name: Check reachability and handler wiring
        # Two silent-failure classes: a production file nothing references, and a
        # `ctx.handlers.X(...)` call site whose symbol no wired handler module
        # provides (a latent TypeError on a real scan).
        run: npm run check:reachability

      - name: Check formatting
        run: npm run format:check

      - name: Check package contents
        # Verify the npm tarball on every branch, not only release tags.
        # This catches npm manifest-shape and publish-tree regressions early.
        run: npm run check:package

      - name: Audit dependencies
        # `npm audit` surfaces known CVEs in the dependency tree. We use the
        # `audit-level=moderate` threshold so we don't fail on dev-time
        # advisories, but do catch anything that would actually ship to users.
        # Production deps (got-scraping, playwright) are the
        # primary concern; dev deps (eslint, prettier, c8) rarely need
        # security gating.
        run: npm audit --audit-level=moderate --omit=dev

      - name: Check publish tree
        # Runs on the clean CI checkout (a fresh clone) to catch any
        # package/runtime content that would dirty the npm tarball. This is
        # the same guard the release publish job runs; surfacing it on every
        # PR catches publish-tree regressions early, before a release.
        run: npm run check:publish-tree

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests (shard ${{ matrix.shard }}/3)
        # Sharding the full suite across 3 runners keeps the slowest shard
        # comfortably inside the job timeout. fail-fast: false on the matrix
        # means one flaky shard won't cancel the others.
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 test/*.test.js

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests with coverage
        # Canonical coverage command (c8 over the full node --test suite).
        # Coverage thresholds are enforced by c8's config in package.json.
        run: npm run test:coverage

  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        # Pin the newest Python Playwright release currently available in
        # the runner's package index so upstream releases cannot silently
        # change CI behavior. The Python and npm package release lines can
        # legitimately differ.
        run: |
          pip install --quiet playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Run Flashscore extractor test
        run: python test/flashscore-extractor.test.py

  # `checks` is the branch-protection context. Keep this job name stable.
  # It runs only after every CI leg and fails closed if any dependency did
  # not finish successfully, so the protected-branch requirement covers the
  # entire suite instead of only the fast quality checks.
  checks:
    if: ${{ always() }}
    needs:
      - quality
      - test
      - coverage
      - python-checks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CI leg to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PYTHON_RESULT: ${{ needs.python-checks.result }}
        run: |
          printf 'quality=%s\ntest=%s\ncoverage=%s\npython=%s\n' \
            "$QUALITY_RESULT" "$TEST_RESULT" "$COVERAGE_RESULT" "$PYTHON_RESULT"
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$PYTHON_RESULT" = success
